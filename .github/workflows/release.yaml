name: Continuous Delivery

on:
  push:
    tags: ["v*"]

permissions:
  # write, not read: the last step creates the GitHub release for the tag.
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A pushed tag is not a release; GitHub never promotes one to the other.
      # v0.1.0 through v0.1.2 shipped images with an empty releases page
      # because nothing here ever asked for one.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}`
